<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>
    Bubblehead — Artist Shift Picker
  </title>


  <style>

    :root {
      --bg:#f6f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --text:#111827;
      --accent:#3b82f6;
      --accent-2:#60a5fa;
      --ring:#93c5fd66;
      --border:#e5e7eb;
      --shadow:0 8px 24px rgba(17,24,39,.06);
    }


    * {
      box-sizing:border-box;
    }


    html,
    body {
      min-height:100%;
    }


    body {
      margin:0;

      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        var(--bg);

      color:
        var(--text);

      -webkit-tap-highlight-color:
        transparent;
    }


    header {
      position:sticky;
      top:0;
      z-index:50;

      backdrop-filter:
        saturate(140%)
        blur(6px);

      background:
        rgba(255,255,255,.86);

      border-bottom:
        1px solid var(--border);
    }


    .wrap {
      max-width:980px;
      margin:0 auto;
      padding:16px 20px;
    }


    .brand {
      display:flex;
      align-items:center;
      gap:12px;
    }


    .logo {
      width:40px;
      height:40px;

      border-radius:12px;

      display:grid;
      place-items:center;

      background:
        linear-gradient(
          135deg,
          var(--accent-2),
          var(--accent)
        );

      color:#fff;
      font-weight:900;

      box-shadow:
        var(--shadow);
    }


    .brand h1 {
      font-size:18px;
      margin:0;
    }


    .sub {
      color:
        var(--muted);

      font-size:12px;

      margin-top:2px;
    }


    .toolbar {
      display:flex;
      flex-wrap:wrap;
      gap:10px;

      align-items:center;

      margin-top:10px;
    }


    .range {
      color:
        var(--muted);

      font-size:13px;
    }


    .spacer {
      flex:1 1 auto;
    }


    .btn {
      cursor:pointer;

      border:
        1px solid var(--border);

      background:#fff;
      color:#111827;

      padding:
        12px 16px;

      border-radius:12px;

      font-weight:600;

      transition:
        .15s ease;

      box-shadow:
        var(--shadow);
    }


    .btn:hover {
      transform:
        translateY(-1px);
    }


    .btn.primary {
      background:
        linear-gradient(
          180deg,
          #3b82f6,
          #2563eb
        );

      color:#fff;
      border-color:transparent;
    }


    .btn[disabled] {
      opacity:.5;
      cursor:not-allowed;
    }


    .calendar {
      display:grid;

      gap:12px;

      margin-top:14px;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(280px,1fr)
        );
    }


    .day {
      border:
        1px solid var(--border);

      border-radius:14px;

      background:
        var(--card);

      overflow:hidden;

      transition:
        .15s ease;

      box-shadow:
        var(--shadow);
    }


    .day:hover {
      transform:
        translateY(-2px);
    }


    .day .head {
      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:10px;

      padding:14px;

      border-bottom:
        1px dashed var(--border);
    }


    .date {
      font-weight:800;
      letter-spacing:.3px;
    }


    .weekday {
      color:
        var(--muted);

      font-size:12px;
    }


    .event {
      font-size:14px;
      font-weight:700;

      color:#3b82f6;

      margin-top:4px;
    }


    .meta {
      display:flex;

      gap:10px;

      padding:
        12px 14px;

      align-items:center;

      flex-wrap:wrap;
    }


    .pill {
      font-size:12px;

      padding:
        6px 10px;

      border-radius:999px;

      border:
        1px solid var(--border);

      background:#f9fafb;

      color:#111827;
    }


    .pill.badge {
      background:#f3f4f6;
    }


    .pill.steady {
      background:#ecfdf5;
      color:#15803d;
      border-color:#a7f3d0;
      font-weight:800;
    }


    .pill.strong {
      background:#fef2f2;
      color:#b91c1c;
      border-color:#fecaca;
      font-weight:900;
    }


    .pill.closed {
      background:#fef2f2;
      color:#7f1d1d;
      border-color:#fecaca;
      font-weight:800;
    }


    .pill.shift-count {
      background:#eff6ff;
      color:#1d4ed8;
      border-color:#bfdbfe;
      font-weight:700;
    }


    .foot {
      display:flex;

      gap:8px;

      padding:
        12px 14px;

      border-top:
        1px dashed var(--border);
    }


    .foot .btn {
      flex:
        0 0 48%;

      max-width:
        48%;
    }


    .toast {
      position:fixed;

      inset-inline:0;
      top:16px;

      display:grid;
      place-items:center;

      pointer-events:none;

      z-index:60;
    }


    .toast .bubble {
      pointer-events:auto;

      background:#ecfdf5;
      color:#065f46;

      border:
        1px solid #a7f3d0;

      box-shadow:
        var(--shadow);

      padding:
        12px 16px;

      border-radius:12px;

      opacity:0;

      transform:
        translateY(-8px);

      transition:
        .25s ease;
    }


    .toast.show .bubble {
      opacity:1;

      transform:
        translateY(0);
    }


    dialog {
      border:none;

      border-radius:16px;

      padding:0;

      background:#fff;

      color:#111827;

      width:
        min(640px,96vw);

      max-height:
        90dvh;

      box-shadow:
        0 30px 60px rgba(0,0,0,.12);
    }


    dialog:not([open]) {
      display:none;
    }


    dialog[open] {
      display:flex;
      flex-direction:column;
    }


    dialog::backdrop {
      background:
        rgba(0,0,0,.35);

      backdrop-filter:
        blur(2px);
    }


    .modal-head {
      display:flex;

      align-items:center;

      justify-content:
        space-between;

      padding:
        14px 16px;

      border-bottom:
        1px solid var(--border);
    }


    .modal-body {
      padding:16px;

      display:grid;

      gap:14px;

      overflow:auto;

      flex:
        1 1 auto;
    }


    .modal-foot {
      display:flex;

      gap:10px;

      padding:
        14px 16px;

      border-top:
        1px solid var(--border);

      justify-content:
        flex-end;

      background:#fff;
    }


    .modal-grid {
      display:grid;

      gap:10px;

      grid-template-columns:
        repeat(2,1fr);
    }


    .modal-grid.full {
      grid-template-columns:
        1fr;
    }


    .modal-grid.dd {
      grid-template-columns:
        1fr 1fr;
    }


    label {
      font-size:13px;

      color:
        var(--muted);

      display:block;

      margin-bottom:6px;
    }


    input[type=text],
    textarea,
    select {

      width:100%;

      padding:
        9px 10px;

      border-radius:10px;

      border:
        1px solid var(--border);

      background:#fff;

      color:#111827;

      outline:none;

      font-size:15px;

      line-height:1.4;
    }


    select {
      min-height:42px;
    }


    select:invalid {
      color:#6b7280;
    }


    input[type=text] {
      min-height:38px;
    }


    textarea {
      min-height:96px;
      max-height:40vh;
      resize:vertical;
    }


    input:focus,
    textarea:focus,
    select:focus {

      box-shadow:
        0 0 0 4px var(--ring);

      border-color:#93c5fd;
    }


    @media (max-width:720px) {

      .wrap {
        padding:
          12px 14px;
      }


      .brand h1 {
        font-size:16px;
      }


      .calendar {
        grid-template-columns:
          1fr;

        gap:10px;
      }


      .btn {
        padding:
          14px 16px;

        border-radius:14px;
      }


      dialog {
        width:100vw;
        max-width:100vw;

        height:100dvh;
        max-height:100dvh;

        margin:0;

        border-radius:0;
      }


      .modal-grid:not(.dd) {
        grid-template-columns:
          1fr;
      }

    }


    @media (max-width:360px) {

      .modal-grid.dd {
        grid-template-columns:
          1fr;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="wrap">

    <div class="brand">

      <div
        class="logo"
        aria-hidden="true"
      >
        BH
      </div>

      <div>

        <h1>
          Bubblehead Caricatures — Artist Shift Picker
        </h1>

        <div class="sub">
          Select a day and shift to submit a request.
          All requests are pending approval.
        </div>

      </div>

    </div>


    <div class="toolbar">

      <div
        class="range"
        id="rangeLabel"
      >
        Loading range…
      </div>

      <div class="spacer"></div>

      <button
        class="btn"
        id="exportBtn"
        type="button"
      >
        Export CSV
      </button>

    </div>

  </div>

</header>



<main class="wrap">

  <section
    class="calendar"
    id="calendar"
    aria-live="polite"
  ></section>

</main>



<dialog
  id="requestModal"
  aria-labelledby="modalTitle"
>

  <form id="requestForm">

    <div class="modal-head">

      <div
        id="modalTitle"
        style="font-weight:800"
      >
        Request Shift
      </div>

      <button
        type="button"
        class="btn"
        id="closeModal"
      >
        ✕
      </button>

    </div>


    <div class="modal-body">


      <div class="modal-grid dd">

        <div>

          <label>
            Date
          </label>

          <input
            type="text"
            id="dateDisplay"
            readonly
          >

        </div>


        <div>

          <label>
            Day of Week
          </label>

          <input
            type="text"
            id="weekdayDisplay"
            readonly
          >

        </div>

      </div>


      <div class="modal-grid full">

        <div>

          <label>
            Event
          </label>

          <input
            type="text"
            id="eventDisplay"
            readonly
          >

        </div>

      </div>


      <div class="modal-grid">

        <div>

          <label for="shiftSelect">
            Select a Shift *
          </label>

          <select
            id="shiftSelect"
            name="shiftSelect"
            required
          >

            <option
              value=""
              selected
              disabled
            >
              Select a shift
            </option>

          </select>

        </div>


        <div>

          <label>
            Expected Crowd
          </label>

          <input
            type="text"
            id="crowdDisplay"
            readonly
          >

        </div>

      </div>


      <div class="modal-grid full">

        <div>

          <label>
            Selected Hours
          </label>

          <input
            type="text"
            id="hoursDisplay"
            readonly
            placeholder="Choose a shift above"
          >

        </div>

      </div>


      <div class="modal-grid full">

        <div>

          <label for="fullName">
            Your Name (First & Last) *
          </label>

          <input
            id="fullName"
            type="text"
            required
            placeholder="Jane Doe"
          >

        </div>

      </div>


      <div class="modal-grid full">

        <div>

          <label for="comments">
            Comments
          </label>

          <textarea
            id="comments"
            placeholder="Anything we should know?"
          ></textarea>

        </div>

      </div>


      <input
        type="hidden"
        id="dateISO"
      >

    </div>


    <div class="modal-foot">

      <button
        type="button"
        class="btn"
        id="cancelBtn"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="btn primary"
      >
        Submit Request
      </button>

    </div>

  </form>

</dialog>



<div
  class="toast"
  id="toast"
  role="status"
  aria-live="polite"
>

  <div
    class="bubble"
    id="toastMsg"
  >
    Received!
  </div>

</div>



<script>


/***** CONFIG *****/

const EVENT_TITLE =
  'Christmas at Grapevine';


const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbxA6MBDUsGlmQXx1Uf429UDcq5sQhTF7b5NzlPbBZ0aoSYDyuq-92-BdyLna5eUUN42Pg/exec';


let SHEET_ROWS = [];
let ROWS = [];



/***** DATE FORMATTERS *****/

const fmt =
  new Intl.DateTimeFormat(
    undefined,
    {
      month:'short',
      day:'numeric',
      year:'numeric'
    }
  );


const fmtWeekday =
  new Intl.DateTimeFormat(
    undefined,
    {
      weekday:'long'
    }
  );


function parseISO(iso) {

  const [y,m,d] =
    String(iso)
      .split('-')
      .map(Number);


  return new Date(
    y,
    m - 1,
    d
  );

}



/***** DOM HELPER *****/

function makeEl(
  tag,
  attrs,
  ...children
) {

  const el =
    document.createElement(tag);


  if (attrs) {

    for (const k in attrs) {

      const v =
        attrs[k];


      if (k === 'class') {

        el.className = v;

      } else if (
        k === 'disabled'
      ) {

        el.disabled =
          !!v;

      } else {

        el.setAttribute(
          k,
          v
        );

      }

    }

  }


  for (const child of children) {

    if (
      child !== null &&
      child !== undefined
    ) {

      el.append(child);

    }

  }


  return el;

}



/***** LOCAL HISTORY *****/

const STORAGE_KEY =
  'bubblehead_shift_requests_2026_v2';


function loadSubmissions() {

  try {

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || '[]'
    );

  } catch {

    return [];

  }

}


function saveSubmission(o) {

  const rows =
    loadSubmissions();

  rows.push(o);

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(rows)
  );

}


function csvEscape(val) {

  const s =
    String(
      val ?? ''
    );

  return '"' +
    s
      .replace(/"/g,'""')
      .replace(/\r?\n/g,'\\n') +
    '"';

}


function exportCSV() {

  const rows =
    loadSubmissions();


  const headers = [

    'DateISO',

    'Date Pretty',

    'Weekday',

    'Event Title',

    'Selected Shift',

    'Hours',

    'Expected Crowd',

    'Closed',

    'Full Name',

    'Comments',

    'Submitted At'

  ];


  const lines = [
    headers.join(',')
  ];


  for (
    const r of rows
  ) {

    const fields = [

      r.dateISO,

      r.datePretty,

      r.weekday,

      r.event || '',

      r.shift || '',

      r.hours || '',

      r.crowd || '',

      r.closed,

      r.fullName,

      r.comments || '',

      r.submittedAt

    ];


    lines.push(
      fields
        .map(csvEscape)
        .join(',')
    );

  }


  const blob =
    new Blob(
      [lines.join('\n')],
      {
        type:'text/csv'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  a.href =
    url;


  a.download =
    'bubblehead_shift_requests_2026.csv';


  a.click();


  URL.revokeObjectURL(
    url
  );

}



/***** PAGE ELEMENTS *****/

const calendar =
  document.getElementById(
    'calendar'
  );


const rangeLabel =
  document.getElementById(
    'rangeLabel'
  );


const toast =
  document.getElementById(
    'toast'
  );


const toastMsg =
  document.getElementById(
    'toastMsg'
  );


document
  .getElementById(
    'exportBtn'
  )
  .addEventListener(
    'click',
    exportCSV
  );


function showToast(message) {

  toastMsg.textContent =
    message;


  toast.classList.add(
    'show'
  );


  setTimeout(
    () =>
      toast.classList.remove(
        'show'
      ),
    2800
  );

}



/***** NORMALIZE DATA *****/

function normalizeRows(
  rawRows
) {

  return rawRows
    .map(r => {

      const iso =
        String(
          r.iso || ''
        ).trim();


      if (!iso) {
        return null;
      }


      const d =
        parseISO(iso);


      const crowd =
        String(
          r.crowd || ''
        ).trim();


      let shifts =
        Array.isArray(r.shifts)
          ? r.shifts
          : [];


      /*
       * Backup compatibility:
       * build shifts manually if an
       * older backend does not return
       * the shifts array.
       */
      if (
        !shifts.length
      ) {

        shifts = [];


        if (r.shift1) {

          shifts.push({
            id:'1st',
            label:'1st Shift',
            hours:
              String(r.shift1)
          });

        }


        if (r.shift2) {

          shifts.push({
            id:'2nd',
            label:'2nd Shift',
            hours:
              String(r.shift2)
          });

        }


        if (r.shift3) {

          shifts.push({
            id:'3rd',
            label:'3rd Shift',
            hours:
              String(r.shift3)
          });

        }

      }


      const isClosed =
        r.closed === true ||
        /CLOSED/i.test(crowd);


      return {

        crowd:
          crowd,

        shifts:
          shifts,

        event:
          r.event ||
          EVENT_TITLE,

        iso:
          iso,

        datePretty:
          fmt.format(d),

        weekdayPretty:
          fmtWeekday.format(d),

        closed:
          isClosed

      };

    })
    .filter(Boolean);

}



/***** LOAD SCHEDULE *****/

async function loadScheduleFromSheets() {

  if (!APPS_SCRIPT_URL) {
    return;
  }


  try {

    const res =
      await fetch(
        APPS_SCRIPT_URL +
        '?op=schedule'
      );


    if (!res.ok) {

      throw new Error(
        'HTTP ' +
        res.status
      );

    }


    const json =
      await res.json();


    if (
      json &&
      Array.isArray(
        json.rows
      )
    ) {

      SHEET_ROWS =
        json.rows;


      ROWS =
        normalizeRows(
          SHEET_ROWS
        );

    }


    if (json.error) {

      console.warn(
        'Apps Script:',
        json.error
      );

    }


  } catch (err) {

    console.warn(
      'Schedule fetch failed:',
      err
    );


    ROWS = [];

  }

}



/***** CROWD BADGE *****/

function buildCrowdBadge(
  row
) {

  if (row.closed) {

    return makeEl(
      'span',
      {
        class:'pill closed'
      },
      'Closed'
    );

  }


  if (
    /strong/i.test(
      row.crowd
    )
  ) {

    return makeEl(
      'span',
      {
        class:'pill strong'
      },
      '🔥 Strong Traffic'
    );

  }


  if (
    /steady/i.test(
      row.crowd
    )
  ) {

    return makeEl(
      'span',
      {
        class:'pill steady'
      },
      'Steady Traffic'
    );

  }


  return makeEl(
    'span',
    {
      class:'pill badge'
    },
    row.crowd ||
    'Crowd TBD'
  );

}



/***** BUILD CALENDAR *****/

function buildCalendar() {


  if (ROWS.length) {

    const dates =
      ROWS
        .map(r =>
          parseISO(r.iso)
        )
        .sort(
          (a,b) =>
            a - b
        );


    rangeLabel.textContent =
      fmt.format(
        dates[0]
      ) +
      ' – ' +
      fmt.format(
        dates[
          dates.length - 1
        ]
      );


  } else {

    rangeLabel.textContent =
      'No dates found';

  }


  calendar.innerHTML = '';


  for (
    const row of ROWS
  ) {


    const card =
      makeEl(
        'article',
        {
          class:'day',

          role:'group',

          'aria-label':
            row.datePretty +
            ', ' +
            row.weekdayPretty
        }
      );


    const information =
      makeEl(
        'div',
        {},

        makeEl(
          'div',
          {
            class:'date'
          },
          row.datePretty
        ),

        makeEl(
          'div',
          {
            class:'weekday'
          },
          row.weekdayPretty
        ),

        makeEl(
          'div',
          {
            class:'event'
          },
          row.event
        )

      );


    const head =
      makeEl(
        'div',
        {
          class:'head'
        },

        information,

        buildCrowdBadge(
          row
        )
      );


    const meta =
      makeEl(
        'div',
        {
          class:'meta'
        }
      );


    if (
      !row.closed &&
      row.shifts.length
    ) {

      const shiftText =
        row.shifts.length === 1
          ? '1 Shift Available'
          : row.shifts.length +
            ' Shifts Available';


      meta.append(
        makeEl(
          'span',
          {
            class:
              'pill shift-count'
          },
          shiftText
        )
      );

    }


    if (
      !row.closed &&
      !row.shifts.length
    ) {

      meta.append(
        makeEl(
          'span',
          {
            class:'pill badge'
          },
          'No shifts available'
        )
      );

    }


    const btn =
      makeEl(
        'button',
        {
          class:'btn primary',
          type:'button'
        },
        'Select Day'
      );


    /*
     * Closed dates OR dates
     * without any shift are
     * not selectable.
     */
    btn.disabled =
      row.closed ||
      row.shifts.length === 0;


    btn.addEventListener(
      'click',
      () => {

        if (!btn.disabled) {

          openRequest(
            row.iso
          );

        }

      }
    );


    const foot =
      makeEl(
        'div',
        {
          class:'foot'
        },
        btn
      );


    card.append(
      head,
      meta,
      foot
    );


    calendar.append(
      card
    );

  }

}



/***** MODAL *****/

const modal =
  document.getElementById(
    'requestModal'
  );


const form =
  document.getElementById(
    'requestForm'
  );


const shiftSelect =
  document.getElementById(
    'shiftSelect'
  );


document
  .getElementById(
    'closeModal'
  )
  .addEventListener(
    'click',
    () =>
      modal.close()
  );


document
  .getElementById(
    'cancelBtn'
  )
  .addEventListener(
    'click',
    () =>
      modal.close()
  );


function getRowByISO(
  iso
) {

  return ROWS.find(
    r =>
      r.iso === iso
  );

}



/***** SHIFT DROPDOWN *****/

function populateShiftSelect(
  row
) {

  shiftSelect.innerHTML = '';


  /*
   * Blank required option.
   * This is selected every
   * time the modal opens.
   */
  const blankOption =
    document.createElement(
      'option'
    );


  blankOption.value =
    '';


  blankOption.textContent =
    'Select a shift';


  blankOption.disabled =
    true;


  blankOption.selected =
    true;


  shiftSelect.append(
    blankOption
  );


  for (
    const shift of row.shifts
  ) {

    const option =
      document.createElement(
        'option'
      );


    option.value =
      shift.id;


    option.textContent =
      shift.label +
      ' — ' +
      shift.hours;


    option.dataset.hours =
      shift.hours;


    option.dataset.label =
      shift.label;


    shiftSelect.append(
      option
    );

  }


  document
    .getElementById(
      'hoursDisplay'
    )
    .value = '';

}



/***** UPDATE HOURS WHEN SHIFT CHANGES *****/

shiftSelect.addEventListener(
  'change',
  () => {

    const option =
      shiftSelect.options[
        shiftSelect.selectedIndex
      ];


    document
      .getElementById(
        'hoursDisplay'
      )
      .value =
        option &&
        option.dataset.hours
          ? option.dataset.hours
          : '';

  }
);



function openRequest(
  iso
) {

  const row =
    getRowByISO(iso);


  if (!row) {
    return;
  }


  document
    .getElementById(
      'dateDisplay'
    )
    .value =
      row.datePretty;


  document
    .getElementById(
      'weekdayDisplay'
    )
    .value =
      row.weekdayPretty;


  document
    .getElementById(
      'eventDisplay'
    )
    .value =
      row.event;


  document
    .getElementById(
      'crowdDisplay'
    )
    .value =
      row.closed
        ? 'Closed'
        : row.crowd;


  document
    .getElementById(
      'dateISO'
    )
    .value =
      row.iso;


  document
    .getElementById(
      'fullName'
    )
    .value =
      '';


  document
    .getElementById(
      'comments'
    )
    .value =
      '';


  populateShiftSelect(
    row
  );


  if (
    typeof modal.showModal ===
    'function'
  ) {

    modal.showModal();

  }

}



/***** SUBMIT *****/

form.addEventListener(
  'submit',
  async (e) => {

    e.preventDefault();


    const iso =
      document
        .getElementById(
          'dateISO'
        )
        .value;


    const row =
      getRowByISO(
        iso
      );


    if (!row) {

      showToast(
        'Unable to find this date.'
      );

      return;

    }


    /*
     * EXTRA VALIDATION.
     * HTML "required" also
     * enforces this.
     */
    if (
      !shiftSelect.value
    ) {

      showToast(
        'Please select a shift.'
      );

      shiftSelect.focus();

      return;

    }


    const selectedOption =
      shiftSelect.options[
        shiftSelect.selectedIndex
      ];


    const shift =
      selectedOption.dataset.label ||
      '';


    const hours =
      selectedOption.dataset.hours ||
      '';


    if (
      !shift ||
      !hours
    ) {

      showToast(
        'Please select a valid shift.'
      );

      return;

    }


    const fullName =
      document
        .getElementById(
          'fullName'
        )
        .value
        .trim();


    if (!fullName) {

      showToast(
        'Please enter your name.'
      );

      return;

    }


    const comments =
      document
        .getElementById(
          'comments'
        )
        .value
        .trim();


    const data = {

      dateISO:
        row.iso,

      datePretty:
        row.datePretty,

      weekday:
        row.weekdayPretty,

      event:
        row.event,

      shift:
        shift,

      hours:
        hours,

      crowd:
        row.crowd,

      closed:
        row.closed,

      fullName:
        fullName,

      comments:
        comments,

      submittedAt:
        new Date()
          .toISOString()

    };


    saveSubmission(
      data
    );


    if (APPS_SCRIPT_URL) {

      try {

        fetch(
          APPS_SCRIPT_URL,
          {
            method:'POST',
            mode:'no-cors',

            body:
              JSON.stringify(
                data
              )
          }
        );

      } catch (err) {

        console.warn(
          'Apps Script POST failed:',
          err
        );

      }

    }


    modal.close();


    showToast(
      "Thanks! We received your submission. We'll confirm after approval."
    );

  }
);



/***** START *****/

(async () => {

  await loadScheduleFromSheets();

  buildCalendar();

})();


</script>
