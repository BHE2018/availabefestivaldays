<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Bubblehead — Artist Shift Picker</title>


  <style>

    :root {
      --bg:#f6f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --text:#111827;
      --accent:#3b82f6;
      --accent-2:#60a5fa;
      --ring:#93c5fd66;
      --border:#e5e7eb;
      --shadow:0 8px 24px rgba(17,24,39,.06);
    }


    * {
      box-sizing:border-box;
    }


    html,
    body {
      min-height:100%;
    }


    body {
      margin:0;
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:var(--bg);
      color:var(--text);

      -webkit-tap-highlight-color:transparent;
    }


    header {
      position:sticky;
      top:0;
      z-index:50;

      backdrop-filter:
        saturate(140%)
        blur(6px);

      background:
        rgba(255,255,255,.86);

      border-bottom:
        1px solid var(--border);
    }


    .wrap {
      max-width:980px;
      margin:0 auto;
      padding:16px 20px;
    }


    .brand {
      display:flex;
      align-items:center;
      gap:12px;
    }


    .logo {
      width:40px;
      height:40px;

      border-radius:12px;

      display:grid;
      place-items:center;

      background:
        linear-gradient(
          135deg,
          var(--accent-2),
          var(--accent)
        );

      color:#fff;
      font-weight:900;

      box-shadow:var(--shadow);
    }


    .brand h1 {
      font-size:18px;
      margin:0;
    }


    .sub {
      color:var(--muted);
      font-size:12px;
      margin-top:2px;
    }


    .toolbar {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      margin-top:10px;
    }


    .range {
      color:var(--muted);
      font-size:13px;
    }


    .spacer {
      flex:1 1 auto;
    }


    .btn {
      cursor:pointer;

      border:
        1px solid var(--border);

      background:#fff;
      color:#111827;

      padding:
        12px 16px;

      border-radius:12px;

      font-weight:600;

      transition:.15s ease;

      box-shadow:
        var(--shadow);
    }


    .btn:hover {
      transform:
        translateY(-1px);
    }


    .btn.primary {
      background:
        linear-gradient(
          180deg,
          #3b82f6,
          #2563eb
        );

      color:#fff;
      border-color:transparent;
    }


    .btn[disabled] {
      opacity:.5;
      cursor:not-allowed;
    }


    .calendar {
      display:grid;
      gap:12px;

      margin-top:14px;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(280px,1fr)
        );
    }


    .day {
      border:
        1px solid var(--border);

      border-radius:14px;

      background:
        var(--card);

      position:relative;
      overflow:hidden;

      transition:.15s ease;

      box-shadow:
        var(--shadow);
    }


    .day:hover {
      transform:
        translateY(-2px);
    }


    .day .head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:10px;

      padding:14px;

      border-bottom:
        1px dashed var(--border);
    }


    .date {
      font-weight:800;
      letter-spacing:.3px;
    }


    .weekday {
      color:var(--muted);
      font-size:12px;
    }


    .event {
      font-size:14px;
      font-weight:700;
      color:#3b82f6;
      margin-top:4px;
    }


    .meta {
      display:flex;
      gap:10px;
      padding:12px 14px;
      align-items:center;
      flex-wrap:wrap;
    }


    .pill {
      font-size:12px;

      padding:
        6px 10px;

      border-radius:999px;

      border:
        1px solid var(--border);

      background:#f9fafb;

      color:#111827;
    }


    .pill.badge {
      background:#f3f4f6;
    }


    /*
      STEADY TRAFFIC
      Green text
    */
    .pill.steady {
      background:#ecfdf5;
      color:#15803d;
      border-color:#a7f3d0;
      font-weight:800;
    }


    /*
      STRONG TRAFFIC
      Red text + fire
    */
    .pill.strong {
      background:#fef2f2;
      color:#b91c1c;
      border-color:#fecaca;
      font-weight:900;
    }


    .pill.closed {
      background:#fef2f2;
      color:#7f1d1d;
      border-color:#fecaca;
      font-weight:800;
    }


    .foot {
      display:flex;
      gap:8px;

      padding:
        12px 14px;

      border-top:
        1px dashed var(--border);
    }


    .foot .btn {
      flex:
        0 0 48%;

      max-width:
        48%;
    }


    .toast {
      position:fixed;

      inset-inline:0;
      top:16px;

      display:grid;
      place-items:center;

      pointer-events:none;

      z-index:60;
    }


    .toast .bubble {
      pointer-events:auto;

      background:#ecfdf5;
      color:#065f46;

      border:
        1px solid #a7f3d0;

      box-shadow:
        var(--shadow);

      padding:
        12px 16px;

      border-radius:12px;

      opacity:0;

      transform:
        translateY(-8px);

      transition:
        .25s ease;
    }


    .toast.show .bubble {
      opacity:1;

      transform:
        translateY(0);
    }


    dialog {
      border:none;

      border-radius:16px;

      padding:0;

      background:#fff;

      color:#111827;

      width:
        min(640px,96vw);

      max-height:
        90dvh;

      box-shadow:
        0 30px 60px rgba(0,0,0,.12);
    }


    dialog:not([open]) {
      display:none;
    }


    dialog[open] {
      display:flex;
      flex-direction:column;
    }


    dialog::backdrop {
      background:
        rgba(0,0,0,.35);

      backdrop-filter:
        blur(2px);
    }


    .modal-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:
        14px 16px;

      border-bottom:
        1px solid var(--border);

      flex:
        0 0 auto;
    }


    .modal-body {
      padding:16px;

      display:grid;
      gap:14px;

      overflow:auto;

      -webkit-overflow-scrolling:
        touch;

      flex:
        1 1 auto;
    }


    .modal-foot {
      display:flex;
      gap:10px;

      padding:
        14px 16px;

      border-top:
        1px solid var(--border);

      justify-content:
        flex-end;

      background:#fff;

      flex:
        0 0 auto;

      padding-bottom:
        calc(
          14px +
          env(safe-area-inset-bottom)
        );
    }


    .modal-grid {
      display:grid;
      gap:10px;
      grid-template-columns:
        repeat(2,1fr);
    }


    .modal-grid.full {
      grid-template-columns:
        1fr;
    }


    .modal-grid.dd {
      grid-template-columns:
        1fr 1fr;
    }


    label {
      font-size:13px;
      color:var(--muted);

      display:block;

      margin-bottom:6px;
    }


    input[type=text],
    textarea {

      width:100%;

      padding:
        9px 10px;

      border-radius:10px;

      border:
        1px solid var(--border);

      background:#fff;

      color:#111827;

      outline:none;

      font-size:15px;
      line-height:1.4;
    }


    input[type=text] {
      min-height:38px;
    }


    textarea {
      min-height:96px;

      max-height:40vh;

      resize:vertical;
    }


    input:focus,
    textarea:focus {

      box-shadow:
        0 0 0 4px var(--ring);

      border-color:
        #93c5fd;
    }


    @media (max-width:720px) {

      .wrap {
        padding:
          12px 14px;
      }

      .brand h1 {
        font-size:16px;
      }

      .calendar {
        grid-template-columns:
          1fr;

        gap:10px;
      }

      .btn {
        padding:
          14px 16px;

        border-radius:14px;
      }

      dialog {
        width:100vw;
        max-width:100vw;

        height:100dvh;
        max-height:100dvh;

        margin:0;

        border-radius:0;
      }

      .day .head {
        padding:12px;
      }

      .meta {
        padding:
          10px 12px;

        gap:8px;
      }

      .foot {
        padding:
          10px 12px;
      }

      .pill {
        font-size:11px;
      }

    }


    @media (max-width:420px) {

      .modal-grid:not(.dd) {
        grid-template-columns:
          1fr;
      }

    }


    @media (max-width:360px) {

      .modal-grid.dd {
        grid-template-columns:
          1fr;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="wrap">

    <div class="brand">

      <div
        class="logo"
        aria-hidden="true"
      >
        BH
      </div>

      <div>

        <h1>
          Bubblehead Caricatures — Artist Shift Picker
        </h1>

        <div class="sub">
          Select a day to request a shift.
          Submissions are pending approval via text or email.
        </div>

      </div>

    </div>


    <div class="toolbar">

      <div
        class="range"
        id="rangeLabel"
      >
        Loading range…
      </div>

      <div class="spacer"></div>

      <button
        class="btn"
        id="exportBtn"
        type="button"
        title="Download submissions made on this device"
      >
        Export CSV
      </button>

    </div>

  </div>

</header>



<main class="wrap">

  <section
    class="calendar"
    id="calendar"
    aria-live="polite"
  ></section>

</main>



<dialog
  id="requestModal"
  aria-labelledby="modalTitle"
>

  <form id="requestForm">

    <div class="modal-head">

      <div
        id="modalTitle"
        style="font-weight:800"
      >
        Request Shift
      </div>

      <button
        type="button"
        class="btn"
        id="closeModal"
        aria-label="Close"
      >
        ✕
      </button>

    </div>


    <div class="modal-body">


      <div class="modal-grid dd">

        <div>

          <label>
            Date
          </label>

          <input
            type="text"
            id="dateDisplay"
            readonly
          >

        </div>


        <div>

          <label>
            Day of Week
          </label>

          <input
            type="text"
            id="weekdayDisplay"
            readonly
          >

        </div>

      </div>


      <div class="modal-grid full">

        <div>

          <label>
            Event
          </label>

          <input
            type="text"
            id="eventDisplay"
            readonly
          >

        </div>

      </div>


      <div class="modal-grid">

        <div>

          <label>
            Open Hours
          </label>

          <input
            type="text"
            id="hoursDisplay"
            readonly
          >

        </div>


        <div>

          <label>
            Expected Crowd
          </label>

          <input
            type="text"
            id="crowdDisplay"
            readonly
          >

        </div>

      </div>


      <div class="modal-grid full">

        <div>

          <label for="fullName">
            Your Name (First & Last) *
          </label>

          <input
            id="fullName"
            name="fullName"
            type="text"
            required
            placeholder="Jane Doe"
          >

        </div>

      </div>


      <div class="modal-grid full">

        <div>

          <label for="comments">
            Comments
          </label>

          <textarea
            id="comments"
            name="comments"
            placeholder="Anything we should know?"
          ></textarea>

        </div>

      </div>


      <input
        type="hidden"
        id="dateISO"
        name="dateISO"
      >


    </div>


    <div class="modal-foot">

      <button
        type="button"
        class="btn"
        id="cancelBtn"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="btn primary"
      >
        Submit Request
      </button>

    </div>

  </form>

</dialog>



<div
  class="toast"
  id="toast"
  role="status"
  aria-live="polite"
>

  <div
    class="bubble"
    id="toastMsg"
  >
    Received!
  </div>

</div>



<script>


/***** CONFIG *****/

const EVENT_TITLE =
  'Christmas at Grapevine';


const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzvAXb4i_AVipzyGLw0aKE2AUpUysKiSbGfKSpkf3vYRX_hP8RAI4nxYm3cVrFlBc-HMQ/exec';


let SHEET_ROWS = [];
let ROWS = [];



/***** DATE FORMATTERS *****/

const fmt =
  new Intl.DateTimeFormat(
    undefined,
    {
      month:'short',
      day:'numeric',
      year:'numeric'
    }
  );


const fmtWeekday =
  new Intl.DateTimeFormat(
    undefined,
    {
      weekday:'long'
    }
  );


function parseISO(iso) {

  const parts =
    String(iso)
      .split('-')
      .map(Number);

  const y = parts[0];
  const m = parts[1];
  const d = parts[2];

  return new Date(
    y,
    m - 1,
    d
  );
}



/***** DOM HELPER *****/

function makeEl(
  tag,
  attrs,
  ...children
) {

  const el =
    document.createElement(tag);


  if (attrs) {

    for (const k in attrs) {

      const v =
        attrs[k];


      if (k === 'class') {

        el.className = v;

      } else if (k === 'disabled') {

        el.disabled = !!v;

      } else if (
        k.startsWith('on') &&
        typeof v === 'function'
      ) {

        el.addEventListener(
          k.slice(2).toLowerCase(),
          v
        );

      } else {

        el.setAttribute(
          k,
          v
        );

      }

    }

  }


  for (const child of children) {

    if (child !== null &&
        child !== undefined) {

      el.append(child);

    }

  }


  return el;
}



/***** LOCAL SUBMISSION HISTORY *****/

const STORAGE_KEY =
  'bubblehead_shift_requests_2026';


function loadSubmissions() {

  try {

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || '[]'
    );

  } catch {

    return [];

  }

}


function saveSubmission(o) {

  const rows =
    loadSubmissions();

  rows.push(o);

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(rows)
  );

}


function csvEscape(val) {

  const s =
    String(
      val ?? ''
    );

  return '"' +
    s
      .replace(/"/g,'""')
      .replace(/\r?\n/g,'\\n') +
    '"';

}


function exportCSV() {

  const rows =
    loadSubmissions();


  const headers = [

    'DateISO',
    'Date Pretty',
    'Weekday',
    'Event Title',
    'Hours',
    'Expected Crowd',
    'Closed',
    'Full Name',
    'Comments',
    'Submitted At'

  ];


  const lines = [
    headers.join(',')
  ];


  for (const r of rows) {

    const fields = [

      r.dateISO,

      r.datePretty,

      r.weekday,

      r.event || '',

      r.hours,

      r.crowd || '',

      r.closed,

      r.fullName,

      r.comments || '',

      r.submittedAt

    ];


    lines.push(
      fields
        .map(csvEscape)
        .join(',')
    );

  }


  const blob =
    new Blob(
      [lines.join('\n')],
      {
        type:'text/csv'
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement('a');


  a.href = url;

  a.download =
    'bubblehead_shift_requests_2026.csv';


  a.click();


  URL.revokeObjectURL(url);

}



/***** PAGE ELEMENTS *****/

const calendar =
  document.getElementById(
    'calendar'
  );


const rangeLabel =
  document.getElementById(
    'rangeLabel'
  );


const toast =
  document.getElementById(
    'toast'
  );


const toastMsg =
  document.getElementById(
    'toastMsg'
  );


document
  .getElementById('exportBtn')
  .addEventListener(
    'click',
    exportCSV
  );


function showToast(message) {

  toastMsg.textContent =
    message;

  toast.classList.add(
    'show'
  );


  setTimeout(
    () =>
      toast.classList.remove(
        'show'
      ),
    2800
  );

}



/***** NORMALIZE GOOGLE SHEET DATA *****/

function normalizeRows(rawRows) {

  return rawRows
    .map(r => {

      /*
       * IMPORTANT:
       * Apps Script now determines
       * the correct year.
       *
       * GitHub no longer guesses
       * 2025 / 2026.
       */
      const iso =
        String(
          r.iso || ''
        ).trim();


      if (!iso) {
        return null;
      }


      const d =
        parseISO(iso);


      const crowd =
        String(
          r.crowd ||
          r.spots ||
          ''
        ).trim();


      const isClosed =
        r.closed === true ||
        /CLOSED/i.test(crowd) ||
        /CLOSED/i.test(
          String(
            r.weekday || ''
          )
        );


      return {

        time:
          String(
            r.time || ''
          ).trim(),

        crowd:
          crowd,

        date:
          r.date,

        event:
          r.event ||
          EVENT_TITLE,

        iso:
          iso,

        datePretty:
          fmt.format(d),

        /*
         * We calculate the weekday
         * from the actual ISO date.
         *
         * This prevents last year's
         * weekday from being copied
         * into the new schedule.
         */
        weekdayPretty:
          fmtWeekday.format(d),

        closed:
          isClosed
      };

    })
    .filter(Boolean);

}



/***** LOAD SCHEDULE *****/

async function loadScheduleFromSheets() {

  if (!APPS_SCRIPT_URL) {
    return;
  }


  try {

    const res =
      await fetch(
        APPS_SCRIPT_URL +
        '?op=schedule'
      );


    if (!res.ok) {

      throw new Error(
        'HTTP ' +
        res.status
      );

    }


    const json =
      await res.json();


    if (
      json &&
      Array.isArray(json.rows)
    ) {

      SHEET_ROWS =
        json.rows;

      ROWS =
        normalizeRows(
          SHEET_ROWS
        );

    }


    if (json.error) {

      console.warn(
        'Apps Script:',
        json.error
      );

    }


  } catch (err) {

    console.warn(
      'Schedule fetch failed:',
      err
    );

    ROWS = [];

  }

}



/***** CROWD BADGE *****/

function buildCrowdBadge(row) {

  if (row.closed) {

    return makeEl(
      'span',
      {
        class:'pill closed'
      },
      'Closed'
    );

  }


  if (
    /strong/i.test(
      row.crowd
    )
  ) {

    return makeEl(
      'span',
      {
        class:'pill strong'
      },
      '🔥 Strong Traffic'
    );

  }


  if (
    /steady/i.test(
      row.crowd
    )
  ) {

    return makeEl(
      'span',
      {
        class:'pill steady'
      },
      'Steady Traffic'
    );

  }


  return makeEl(
    'span',
    {
      class:'pill badge'
    },
    row.crowd ||
    'Crowd TBD'
  );

}



/***** BUILD CALENDAR *****/

function buildCalendar() {


  if (ROWS.length) {

    const first =
      parseISO(
        ROWS[0].iso
      );


    const last =
      parseISO(
        ROWS[
          ROWS.length - 1
        ].iso
      );


    rangeLabel.textContent =
      fmt.format(first) +
      ' – ' +
      fmt.format(last);


  } else {

    rangeLabel.textContent =
      'No dates found';

  }


  calendar.innerHTML = '';


  for (const row of ROWS) {


    const card =
      makeEl(
        'article',
        {
          class:'day',
          role:'group',
          'aria-label':
            row.datePretty +
            ', ' +
            row.weekdayPretty
        }
      );


    const information =
      makeEl(
        'div',
        {},

        makeEl(
          'div',
          {
            class:'date'
          },
          row.datePretty
        ),

        makeEl(
          'div',
          {
            class:'weekday'
          },
          row.weekdayPretty
        ),

        makeEl(
          'div',
          {
            class:'event'
          },
          row.event
        )
      );


    const head =
      makeEl(
        'div',
        {
          class:'head'
        },

        information,

        buildCrowdBadge(row)
      );


    const meta =
      makeEl(
        'div',
        {
          class:'meta'
        },

        makeEl(
          'span',
          {
            class:'pill badge'
          },
          'Time: ' +
          row.time
        )
      );


    const btn =
      makeEl(
        'button',
        {
          class:'btn primary',
          type:'button'
        },
        'Select Day'
      );


    btn.disabled =
      !!row.closed;


    btn.addEventListener(
      'click',
      () => {

        if (!btn.disabled) {
          openRequest(
            row.iso
          );
        }

      }
    );


    const foot =
      makeEl(
        'div',
        {
          class:'foot'
        },
        btn
      );


    card.append(
      head,
      meta,
      foot
    );


    card.id =
      'day-' +
      row.iso;


    calendar.append(
      card
    );

  }

}



/***** REQUEST MODAL *****/

const modal =
  document.getElementById(
    'requestModal'
  );


const closeModalBtn =
  document.getElementById(
    'closeModal'
  );


const cancelBtn =
  document.getElementById(
    'cancelBtn'
  );


const form =
  document.getElementById(
    'requestForm'
  );


closeModalBtn
  .addEventListener(
    'click',
    () =>
      modal.close()
  );


cancelBtn
  .addEventListener(
    'click',
    () =>
      modal.close()
  );


function getRowByISO(iso) {

  return ROWS.find(
    r =>
      r.iso === iso
  );

}


function openRequest(iso) {

  const row =
    getRowByISO(iso);


  if (!row) {
    return;
  }


  document
    .getElementById(
      'dateDisplay'
    )
    .value =
      row.datePretty;


  document
    .getElementById(
      'weekdayDisplay'
    )
    .value =
      row.weekdayPretty;


  document
    .getElementById(
      'eventDisplay'
    )
    .value =
      row.event;


  document
    .getElementById(
      'hoursDisplay'
    )
    .value =
      row.time;


  document
    .getElementById(
      'crowdDisplay'
    )
    .value =
      row.closed
        ? 'Closed'
        : row.crowd;


  document
    .getElementById(
      'dateISO'
    )
    .value =
      row.iso;


  document
    .getElementById(
      'fullName'
    )
    .value = '';


  document
    .getElementById(
      'comments'
    )
    .value = '';


  if (
    typeof modal.showModal ===
    'function'
  ) {

    modal.showModal();

  }

}



/***** SUBMIT REQUEST *****/

form.addEventListener(
  'submit',
  async (e) => {

    e.preventDefault();


    const iso =
      document
        .getElementById(
          'dateISO'
        )
        .value;


    const row =
      getRowByISO(iso);


    if (!row) {

      showToast(
        'Unable to find this shift.'
      );

      return;

    }


    const fullName =
      document
        .getElementById(
          'fullName'
        )
        .value
        .trim();


    const comments =
      document
        .getElementById(
          'comments'
        )
        .value
        .trim();


    if (!fullName) {

      showToast(
        'Please enter your name.'
      );

      return;

    }


    const data = {

      dateISO:
        row.iso,

      datePretty:
        row.datePretty,

      weekday:
        row.weekdayPretty,

      event:
        row.event,

      hours:
        row.time,

      crowd:
        row.crowd,

      closed:
        row.closed,

      fullName:
        fullName,

      comments:
        comments,

      submittedAt:
        new Date()
          .toISOString()

    };


    saveSubmission(
      data
    );


    if (APPS_SCRIPT_URL) {

      try {

        /*
         * no-cors is used because
         * Google Apps Script web apps
         * do not provide a normal
         * browser CORS response.
         *
         * Do NOT add application/json
         * headers here.
         */
        fetch(
          APPS_SCRIPT_URL,
          {
            method:'POST',
            mode:'no-cors',
            body:
              JSON.stringify(
                data
              )
          }
        );

      } catch (err) {

        console.warn(
          'Apps Script POST failed:',
          err
        );

      }

    }


    modal.close();


    showToast(
      "Thanks! We received your submission. We'll confirm after approval."
    );

  }
);



/***** START APP *****/

(async () => {

  await loadScheduleFromSheets();

  buildCalendar();

})();


</script>
